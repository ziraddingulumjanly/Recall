<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1b120b" />
  <title>Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-shell">
    <div class="ambient ambient-left" aria-hidden="true"></div>
    <div class="ambient ambient-right" aria-hidden="true"></div>
    <div class="ambient ambient-bottom" aria-hidden="true"></div>

    <div class="topic-picker" id="topicPicker">
      <button
        class="topic-picker-toggle"
        id="topicPickerToggle"
        type="button"
        aria-haspopup="true"
        aria-expanded="false"
        aria-controls="topicPickerMenu"
      >
        <span id="topicPickerLabel">All topics</span>
        <svg class="topic-picker-chevron" viewBox="0 0 20 20" aria-hidden="true">
          <path d="m5.5 7.5 4.5 4.5 4.5-4.5" />
        </svg>
      </button>

      <div class="topic-picker-menu" id="topicPickerMenu" role="menu" aria-hidden="true">
        <button class="topic-option is-active" type="button" data-category="all" role="menuitem" aria-pressed="true">
          <span>All topics</span><small>147</small>
        </button>
        <button class="topic-option" type="button" data-category="data-science" role="menuitem" aria-pressed="false">
          <span>Data Science</span><small>38</small>
        </button>
        <button class="topic-option" type="button" data-category="machine-learning" role="menuitem" aria-pressed="false">
          <span>Machine Learning</span><small>41</small>
        </button>
        <button class="topic-option" type="button" data-category="deep-learning" role="menuitem" aria-pressed="false">
          <span>Deep Learning</span><small>68</small>
        </button>
      </div>
    </div>

    <a
      class="github-link"
      href="https://github.com/ziraddingulumjanly"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="GitHub"
      title="GitHub"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.2c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.57-.29-5.27-1.29-5.27-5.73 0-1.27.45-2.3 1.19-3.11-.12-.29-.52-1.47.11-3.07 0 0 .97-.31 3.16 1.19A10.9 10.9 0 0 1 12 6.07c.98 0 1.96.13 2.88.39 2.19-1.5 3.16-1.19 3.16-1.19.63 1.6.23 2.78.11 3.07.74.81 1.19 1.84 1.19 3.11 0 4.46-2.71 5.43-5.29 5.72.42.36.79 1.07.79 2.16v3.22c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/>
      </svg>
    </a>

    <section class="practice" aria-labelledby="page-title">
      <header class="practice-header">
        <h1 id="page-title">Practice</h1>
        <p>Click the orb to generate a question o.</p>
      </header>

      <button class="question-orb" id="questionOrb" type="button" aria-label="Get a question">
        <span class="orb-highlight" aria-hidden="true"></span>
        <span class="orb-content">
          <svg class="book-icon" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M8 15.5C8 12.5 10.5 10 13.5 10H27c3.5 0 6.3 1.2 8 3.5C36.7 11.2 39.5 10 43 10h7.5c3 0 5.5 2.5 5.5 5.5V49c0 2-1.7 3.5-3.7 3.3L42 51.1c-4-.5-7.3 1.1-7.3 1.1S31.4 50.6 27.3 51L11.7 52.3C9.7 52.5 8 51 8 49V15.5Z" />
            <path d="M34.7 14v38" />
          </svg>
          <span class="orb-label">Get a<br />Question</span>
        </span>
      </button>

      <section
        class="question-card"
        id="questionCard"
        aria-live="polite"
        aria-hidden="true"
        tabindex="-1"
        aria-label="Question card. Click to reveal the answer."
      >
        <div class="question-line">
          <p id="questionText" class="question-text"></p>
        </div>

        <section class="answer-section" id="answerSection" aria-hidden="true">
          <div class="answer-label">Answer</div>
          <div class="answer-content" id="answerText"></div>
        </section>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
